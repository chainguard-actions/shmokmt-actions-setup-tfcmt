name: Test basic usage - install latest tfcmt
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert tfcmt is installed
        run: |
          if ! command -v tfcmt > /dev/null 2>&1; then
            echo "FAIL: tfcmt binary not found in PATH"
            exit 1
          fi
          echo "PASS: tfcmt is installed"
      - name: Assert tfcmt version output
        run: |
          VERSION_OUTPUT=$(tfcmt --version 2>&1)
          echo "tfcmt version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: tfcmt --version produced no output"
            exit 1
          fi
          echo "PASS: tfcmt --version returned output"
