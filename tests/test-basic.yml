name: Test setup-tfcmt basic (latest version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        # No version input — defaults to "latest"
      - name: Assert tfcmt is installed and executable
        run: |
          echo "Checking tfcmt is on PATH..."
          if ! command -v tfcmt &>/dev/null; then
            echo "FAIL: tfcmt not found on PATH"
            exit 1
          fi
          echo "PASS: tfcmt found at $(command -v tfcmt)"
      - name: Assert tfcmt version output is non-empty
        run: |
          VERSION_OUTPUT=$(tfcmt --version 2>&1)
          echo "tfcmt --version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: tfcmt --version produced no output"
            exit 1
          fi
          echo "PASS"
