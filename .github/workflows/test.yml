name: Setup test
on:
  pull_request:
  push:
    branches:
      - "main"
permissions: {}
jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - run: sleep 5

      - name: use the action
        uses: ./
        with:
          version: "latest"

      - name: show outputs
        run: |
          tfcmt --version

  test-darwin:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - run: sleep 5

      - name: use the action
        uses: ./
        with:
          version: "latest"

      - name: show outputs
        run: |
          tfcmt --version
